<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHABAAZ HUSSAIN</title>
    <!-- Favicon: White 'S' on Black Circle -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23000000'/><text x='50' y='70' font-family='sans-serif' font-size='60' font-weight='bold' fill='%23ffffff' text-anchor='middle'>S</text></svg>" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #030303; /* Deep black/slate */
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
        cursor: default; /* Global default cursor */
      }
      /* Custom scrollbar for a sleeker look */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030303;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .infinity-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 3s ease-in-out forwards;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* New Animations for "Life" */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 5s ease-in-out infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 8s linear infinite;
      }
      /* Hero reveal, timed to land as the infinity finishes tracing */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in-up { animation: fade-in-up 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .animate-fade-in { animation: fade-in 1.3s ease both; }
      .reveal-1 { animation-delay: 2.5s; }
      .reveal-2 { animation-delay: 2.8s; }
      .reveal-3 { animation-delay: 3.2s; }
      @media (prefers-reduced-motion: reduce) {
        .animate-float,
        .animate-pulse-glow,
        .animate-shimmer,
        .infinity-path { animation: none; }
        .infinity-path { stroke-dashoffset: 0; }
        .animate-fade-in-up,
        .animate-fade-in {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
      .showcase-grid {
        background-image:
          linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(82% 90% at 50% 50%, #000 18%, transparent 100%);
        mask-image: radial-gradient(82% 90% at 50% 50%, #000 18%, transparent 100%);
      }
      .showcase-card {
        transition:
          transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.55s ease,
          box-shadow 0.55s ease;
      }
      .showcase-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.16);
        box-shadow: 0 26px 65px -28px rgba(0,0,0,0.95);
      }
      @media (prefers-reduced-motion: reduce) {
        .showcase-card,
        .showcase-card:hover {
          transform: none;
        }
      }
    </style>
