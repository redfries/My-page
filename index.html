<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shabaaz Hussain — AI &amp; ML Portfolio</title>
    <meta name="description" content="Portfolio of Shabaaz Hussain (infinitys.me) featuring interactive 3D neon infinity tubes that smoothly transition on scroll to illuminate project and capability cards." />
    <meta property="og:title" content="Shabaaz Hussain — AI &amp; ML Portfolio" />
    <meta property="og:description" content="Portfolio of Shabaaz Hussain (infinitys.me) featuring interactive 3D neon infinity tubes that smoothly transition on scroll to illuminate project and capability cards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Favicon: White 'S' on Black Circle -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23000000'/><text x='50' y='70' font-family='sans-serif' font-size='60' font-weight='bold' fill='%23ffffff' text-anchor='middle'>S</text></svg>" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
      body {
        font-family: 'Space Grotesk', sans-serif;
        background-color: #030303;
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
        cursor: default;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030303;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .infinity-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 3s ease-in-out forwards;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
        50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.1); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 5s ease-in-out infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      .animate-shimmer {
        background-size: 200% auto;
        animation: shimmer 8s linear infinite;
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in-up { animation: fade-in-up 1.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .animate-fade-in { animation: fade-in 1.3s ease both; }
      .reveal-1 { animation-delay: 2.5s; }
      .reveal-2 { animation-delay: 2.8s; }
      .reveal-3 { animation-delay: 3.2s; }
      @media (prefers-reduced-motion: reduce) {
        .animate-float,
        .animate-pulse-glow,
        .animate-shimmer,
        .infinity-path { animation: none; }
        .infinity-path { stroke-dashoffset: 0; }
        .animate-fade-in-up,
        .animate-fade-in {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
      .showcase-grid {
        background-image:
          linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(82% 90% at 50% 50%, #000 18%, transparent 100%);
        mask-image: radial-gradient(82% 90% at 50% 50%, #000 18%, transparent 100%);
      }
      .showcase-card {
        transition:
          transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.55s ease,
          box-shadow 0.55s ease;
      }
      .showcase-card:hover {
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.18);
        box-shadow: 0 26px 65px -28px rgba(0,0,0,0.95);
      }
      /* Live 3D Tube Card Illumination System */
      .illuminated-card {
        --illumination: 0;
        --glow-x: 50%;
        --glow-y: 50%;
        --glow-color: #7dd3fc;
        position: relative;
        transition:
          transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.4s ease,
          box-shadow 0.4s ease,
          background-color 0.4s ease;
        box-shadow:
          0 24px 60px -28px rgba(0, 0, 0, 0.92),
          0 0 calc(56px * var(--illumination, 0)) -10px color-mix(in srgb, var(--glow-color, #7dd3fc) 42%, transparent);
      }
      /* Soft ambient reading spotlight inside the card tracking the live 3D tubes */
      .illuminated-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 1;
        opacity: var(--illumination, 0);
        background:
          radial-gradient(
            640px circle at var(--glow-x, 50%) var(--glow-y, 50%),
            color-mix(in srgb, var(--glow-color, #7dd3fc) 13%, transparent),
            color-mix(in srgb, var(--glow-color, #7dd3fc) 4%, transparent) 44%,
            transparent 72%
          );
        transition: opacity 0.25s ease;
      }
      /* Specular illuminated border rim tracking the live 3D tubes */
      .illuminated-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        pointer-events: none;
        z-index: 25;
        opacity: calc(var(--illumination, 0) * 1);
        background: radial-gradient(
          540px circle at var(--glow-x, 50%) var(--glow-y, 50%),
          var(--glow-color, #7dd3fc),
          rgba(255, 255, 255, 0.42) 40%,
          transparent 78%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        transition: opacity 0.25s ease;
      }
      .illuminated-card[data-illuminated="true"] {
        border-color: color-mix(in srgb, var(--glow-color, #7dd3fc) 48%, rgba(255, 255, 255, 0.2));
        background-color: rgba(8, 9, 13, 0.80);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .illuminated-card[data-illuminated="true"] .card-readable-copy {
        color: #e5e7eb;
      }
      .illuminated-card[data-illuminated="true"] .card-readable-step {
        color: #d4d4d8;
      }
      @media (prefers-reduced-motion: reduce) {
        .showcase-card,
        .showcase-card:hover,
        .illuminated-card {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
