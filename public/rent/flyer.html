<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TO LET — 3 BHK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .a4-page {
      width: 210mm;
      height: 297mm;
      max-width: 210mm;
      max-height: 297mm;
      margin: 0 auto;
      padding: 18mm 16mm 16mm;
      position: relative;
      background: #050505;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      overflow: hidden;
      border: 3.5mm solid #facc15;
    }

    /* TOP SECTION: TO LET 3BHK */
    .header-group {
      width: 100%;
      padding-top: 4mm;
    }

    .title-to-let {
      font-size: 74pt;
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: 0.04em;
      color: #facc15;
      text-transform: uppercase;
      text-shadow: 0 0 35px rgba(250, 204, 21, 0.45);
    }

    .title-3bhk {
      font-size: 58pt;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.05em;
      color: #ffffff;
      text-transform: uppercase;
      margin-top: 3mm;
    }

    /* MIDDLE SECTION: SCANNER & SCAN FOR MORE INFO */
    .scanner-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: auto 0;
    }

    .qr-card {
      background: #ffffff;
      padding: 4.5mm;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 4px #facc15;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-holder {
      width: 58mm;
      height: 58mm;
    }

    .qr-holder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .scan-label {
      font-size: 17pt;
      font-weight: 900;
      color: #facc15;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 5mm;
    }

    .domain-text {
      font-size: 13pt;
      font-weight: 700;
      color: #e5e5e5;
      letter-spacing: 0.05em;
      margin-top: 1.5mm;
      font-family: monospace;
    }

    /* BOTTOM SECTION: MOBILE NUMBERS */
    .contact-group {
      width: 100%;
      padding-bottom: 4mm;
      display: flex;
      flex-direction: column;
      gap: 3mm;
    }

    .phone-item {
      font-size: 30pt;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.05em;
      white-space: nowrap;
      line-height: 1.1;
      background: rgba(250, 204, 21, 0.08);
      border: 2px solid rgba(250, 204, 21, 0.35);
      border-radius: 14px;
      padding: 3mm 0;
    }

    .phone-item span.prefix {
      color: #facc15;
      margin-right: 4px;
    }

    @media print {
      body {
        background: #000000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <div class="a4-page">
    
    <!-- 1. TO LET & 3BHK -->
    <div class="header-group">
      <div class="title-to-let">TO LET</div>
      <div class="title-3bhk">3 BHK</div>
    </div>

    <!-- 2. SCANNER & SCAN FOR MORE INFORMATION -->
    <div class="scanner-group">
      <div class="qr-card">
        <div class="qr-holder">
          <img src="./qr-code-highres.png" alt="Scan QR Code" />
        </div>
      </div>
      <div class="scan-label">SCAN FOR MORE INFORMATION</div>
      <div class="domain-text">infinitys.me/rent</div>
    </div>

    <!-- 3. MOBILE NUMBERS -->
    <div class="contact-group">
      <div class="phone-item">
        <span class="prefix">+91</span> 70133 71541
      </div>
      <div class="phone-item">
        <span class="prefix">+91</span> 98486 59417
      </div>
    </div>

  </div>

</body>
</html>
